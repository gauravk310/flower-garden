<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Flower Garden</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: linear-gradient(to bottom, #0a0e27 0%, #1a1b3e 50%, #0f1628 100%);
            cursor: crosshair;
            font-family: system-ui, -apple-system, sans-serif;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .instruction {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            text-align: center;
            pointer-events: none;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="instruction">✨ Click anywhere to grow a magical flower ✨</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        const colors = [
            '#00ffff', // cyan
            '#ff69b4', // pink
            '#9d4edd', // purple
            '#ffd700', // yellow
            '#ff8c42', // orange
            '#4ade80', // green
            '#ffffff'  // white
        ];
        let colorIndex = 0;

        // Floating particles
        const particles = [];
        for (let i = 0; i < 40; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2 + 0.5,
                speedY: Math.random() * 0.3 + 0.1,
                speedX: (Math.random() - 0.5) * 0.2,
                opacity: Math.random() * 0.5 + 0.2
            });
        }

        // Flowers array
        const flowers = [];

        class Flower {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.stage = 0; // 0: seed, 1: stem growing, 2: leaves, 3: bud, 4: blooming, 5: complete
                this.stemHeight = 0;
                this.maxStemHeight = Math.random() * 60 + 80;
                this.leaves = [];
                this.budSize = 0;
                this.petalAngle = 0;
                this.petalCount = 8;
                this.bloomProgress = 0;
                this.glowPulse = 0;
                this.sparkles = [];
                this.time = 0;
                
                // Calculate tilt based on position relative to center
                const centerX = canvas.width / 2;
                const distanceFromCenter = (x - centerX) / (canvas.width / 2);
                this.tilt = distanceFromCenter * 0.4; // Tilt angle in radians
                this.stemEndX = x + Math.sin(this.tilt) * this.maxStemHeight;
            }

            update(deltaTime) {
                this.time += deltaTime;
                this.glowPulse = Math.sin(this.time * 0.003) * 0.3 + 0.7;

                if (this.stage === 0) {
                    // Seed phase - quick
                    setTimeout(() => this.stage = 1, 100);
                }
                else if (this.stage === 1) {
                    // Stem growing
                    this.stemHeight += 2;
                    if (this.stemHeight >= this.maxStemHeight) {
                        this.stemHeight = this.maxStemHeight;
                        this.stage = 2;
                    }
                    // Add leaves
                    if (this.stemHeight % 20 === 0 && this.leaves.length < 4) {
                        this.leaves.push({
                            y: this.stemHeight,
                            side: this.leaves.length % 2 === 0 ? -1 : 1,
                            size: 0,
                            maxSize: Math.random() * 8 + 10
                        });
                    }
                }
                else if (this.stage === 2) {
                    // Leaves growing
                    let allGrown = true;
                    this.leaves.forEach(leaf => {
                        if (leaf.size < leaf.maxSize) {
                            leaf.size += 0.5;
                            allGrown = false;
                        }
                    });
                    if (allGrown) this.stage = 3;
                }
                else if (this.stage === 3) {
                    // Bud appearing
                    this.budSize += 0.3;
                    if (this.budSize >= 12) {
                        this.budSize = 12;
                        this.stage = 4;
                    }
                }
                else if (this.stage === 4) {
                    // Blooming
                    this.bloomProgress += 0.015;
                    if (this.bloomProgress >= 1) {
                        this.bloomProgress = 1;
                        this.stage = 5;
                    }
                }
                else if (this.stage === 5) {
                    // Complete - create sparkles
                    if (Math.random() < 0.1) {
                        this.sparkles.push({
                            x: this.x + (Math.random() - 0.5) * 20,
                            y: this.y - this.maxStemHeight,
                            vy: -Math.random() * 2 - 1,
                            vx: (Math.random() - 0.5) * 0.5,
                            life: 1,
                            size: Math.random() * 2 + 1
                        });
                    }
                }

                // Update sparkles
                this.sparkles = this.sparkles.filter(s => {
                    s.y += s.vy;
                    s.x += s.vx;
                    s.life -= 0.015;
                    return s.life > 0;
                });

                // Update leaves
                this.leaves.forEach(leaf => {
                    if (leaf.size < leaf.maxSize) {
                        leaf.size += 0.3;
                    }
                });
            }

            draw(ctx) {
                const progress = this.stemHeight / this.maxStemHeight;
                const currentTiltX = this.x + Math.sin(this.tilt) * this.stemHeight;
                const stemTop = this.y - this.stemHeight * Math.cos(this.tilt);

                // Draw stem with tilt
                if (this.stemHeight > 0) {
                    ctx.strokeStyle = `rgba(76, 175, 80, 0.8)`;
                    ctx.lineWidth = 3;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(currentTiltX, stemTop);
                    ctx.stroke();

                    // Subtle glow on stem
                    ctx.strokeStyle = `rgba(76, 175, 80, 0.3)`;
                    ctx.lineWidth = 5;
                    ctx.stroke();
                }

                // Draw leaves
                this.leaves.forEach(leaf => {
                    if (leaf.size > 0) {
                        const leafProgress = leaf.y / this.maxStemHeight;
                        const leafX = this.x + Math.sin(this.tilt) * leaf.y;
                        const leafY = this.y - leaf.y * Math.cos(this.tilt);
                        
                        ctx.fillStyle = `rgba(76, 175, 80, 0.7)`;
                        ctx.beginPath();
                        ctx.ellipse(
                            leafX + leaf.side * (leaf.size * 0.8),
                            leafY,
                            leaf.size,
                            leaf.size * 0.6,
                            leaf.side * Math.PI / 6 + this.tilt,
                            0,
                            Math.PI * 2
                        );
                        ctx.fill();
                    }
                });

                // Draw bud
                if (this.stage >= 3 && this.stage < 4) {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.ellipse(currentTiltX, stemTop, this.budSize * 0.5, this.budSize, this.tilt, 0, Math.PI * 2);
                    ctx.fill();

                    // Bud glow
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = this.color;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                // Draw blooming/complete flower
                if (this.stage >= 4) {
                    const flowerY = stemTop;
                    const petalLength = 15 + this.bloomProgress * 10;
                    
                    ctx.save();
                    ctx.translate(currentTiltX, flowerY);
                    
                    // Draw petals
                    for (let i = 0; i < this.petalCount; i++) {
                        const angle = (Math.PI * 2 * i) / this.petalCount;
                        const petalSize = petalLength * this.bloomProgress;
                        
                        ctx.save();
                        ctx.rotate(angle);
                        
                        // Petal with glow
                        ctx.fillStyle = this.color;
                        ctx.shadowBlur = 8 * this.glowPulse;
                        ctx.shadowColor = this.color;
                        
                        ctx.beginPath();
                        ctx.ellipse(0, -petalSize * 0.6, petalSize * 0.5, petalSize, 0, 0, Math.PI * 2);
                        ctx.fill();
                        
                        ctx.restore();
                    }
                    
                    ctx.shadowBlur = 0;
                    
                    // Center of flower
                    ctx.fillStyle = '#ffd700';
                    ctx.beginPath();
                    ctx.arc(0, 0, 6 * this.bloomProgress, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Center glow
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#ffd700';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    
                    ctx.restore();
                }

                // Draw sparkles - adjust position based on stem position
                this.sparkles.forEach(s => {
                    ctx.fillStyle = `rgba(255, 255, 255, ${s.life})`;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = this.color;
                    ctx.beginPath();
                    ctx.arc(s.x + Math.sin(this.tilt) * this.maxStemHeight * 0.5, s.y, s.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });

                // Draw seed (initial state)
                if (this.stage === 0) {
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }
        }

        // Animation loop
        let lastTime = Date.now();
        
        function animate() {
            const currentTime = Date.now();
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw floating particles
            particles.forEach(p => {
                p.y -= p.speedY;
                p.x += p.speedX;

                if (p.y < -10) p.y = canvas.height + 10;
                if (p.x < -10) p.x = canvas.width + 10;
                if (p.x > canvas.width + 10) p.x = -10;

                ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Update and draw flowers
            flowers.forEach(flower => {
                flower.update(deltaTime);
                flower.draw(ctx);
            });

            requestAnimationFrame(animate);
        }

        // Click handler
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            // Define invisible ground level at 85% of canvas height
            const groundY = canvas.height * 0.85;

            const color = colors[colorIndex];
            colorIndex = (colorIndex + 1) % colors.length;

            // Plant flower at ground level, directly below click point
            flowers.push(new Flower(x, groundY, color));
        });

        animate();
    </script>
</body>
</html>
